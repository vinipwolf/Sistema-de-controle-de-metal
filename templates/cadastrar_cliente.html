<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Cliente</title>
</head>
<body>

    <h1>Cadastrar Cliente</h1>

    <form action="/cadastrar-cliente" method="POST">

        <label for="nome">Nome:</label>

        <input
            type="text"
            id="nome"
            name="nome"
            required
        >

        <button type="submit">
            Cadastrar
        </button>

    </form>

</body>
</html>
